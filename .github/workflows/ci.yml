name: CI

on:
  push:
    branches:
      - feat/model-guard
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-guard-tests:
    name: Model Guard unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Run focused tests
        working-directory: backend
        run: |
          go test -p 1 -tags unit \
            ./internal/codexeval \
            ./internal/service \
            ./internal/repository \
            ./internal/handler/admin \
            -run 'Test(Codex|ModelGuard|Fingerprint|HasStandalone)' \
            -count=1
